# ============================================================
# 文件名称：Cargo.toml
# 创建时间：2026-06-02
# 功能描述：LimxDesk Tauri v2 桌面端 Rust 依赖配置
#
# 依赖分组：
#   1. Tauri 框架与插件（tray-icon / shell / dialog / fs）
#   2. 序列化（serde / serde_json）
#   3. 日志（tracing / tracing-subscriber）
# ============================================================

[workspace]
members = [
    ".",
    "crates/limxdesk-cue",
    "crates/limxdesk-fixture-selection",
    "crates/limxdesk-fixture-types",
    "crates/limxdesk-gdtf",
    "crates/limxdesk-artnet",
    "crates/limxdesk-dmx",
    "crates/limxdesk-engine",
    "crates/limxdesk-network",
    "crates/limxdesk-patch",
    "crates/limxdesk-playback",
    "crates/limxdesk-programmer",
    "crates/limxdesk-sequence",
    "crates/limxdesk-platform",
    "crates/limxdesk-showfile",
]
resolver = "2"

[package]
name = "LimxDesk"
version = "0.1.0"
description = "LimxDesk 桌面应用"
authors = ["LimxDeskTeam"]
edition = "2021"

[lib]
name = "limxdesk_lib"
path = "src/lib.rs"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "LimxDesk"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── 0. LimxDesk 核心模块 ──────────────────────────────────
limxdesk-platform = { path = "crates/limxdesk-platform" }
limxdesk-showfile = { path = "crates/limxdesk-showfile" }
limxdesk-fixture-selection = { path = "crates/limxdesk-fixture-selection" }
limxdesk-fixture-types = { path = "crates/limxdesk-fixture-types" }
limxdesk-patch = { path = "crates/limxdesk-patch" }
limxdesk-programmer = { path = "crates/limxdesk-programmer" }
limxdesk-cue = { path = "crates/limxdesk-cue" }
limxdesk-sequence = { path = "crates/limxdesk-sequence" }
limxdesk-playback = { path = "crates/limxdesk-playback" }
limxdesk-dmx = { path = "crates/limxdesk-dmx" }
limxdesk-engine = { path = "crates/limxdesk-engine" }
limxdesk-network = { path = "crates/limxdesk-network" }
limxdesk-artnet = { path = "crates/limxdesk-artnet" }

# ── 1. Tauri 框架与插件 ───────────────────────────────────
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# ── 2. 序列化 ────────────────────────────────────────────
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── 3. 日志 ──────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# 开发构建：自身代码保持 opt-level=1（兼顾编译速度与可调试性），
# 依赖库一律 opt-level=3。GDTF 解析、DMX 渲染、Art-Net 打包在 opt-level=0
# 下比 release 慢一个数量级，是 tauri:dev 下操作卡顿的主要来源。
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
strip = "symbols"
panic = "abort"
